<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPIK I 初級単語帳 · 1671</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#F5F1E6;
  --bg-0:#12141C;
  --bg-1:#181B26;
  --bg-2:#20242F;
  --line:#323748;
  --saffron:#F2B705;
  --saffron-dim:#8a6d1f;
  --mint:#5FCB93;
  --coral:#E8604C;
  --muted:#8B90A3;
  --radius:18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(242,183,5,0.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(95,203,147,0.08), transparent 60%),
    var(--bg-0);
  color:var(--ink);
  font-family:'Noto Sans KR','Noto Sans JP',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px;}

/* ---- Header ---- */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand .eyebrow{
  font-family:'Space Mono',monospace;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--saffron);
}
.brand h1{
  font-family:'Gowun Batang',serif;
  font-weight:700;font-size:30px;margin:2px 0 0;letter-spacing:-0.01em;
}
.brand .sub{color:var(--muted);font-size:13px;margin-top:4px;}
.count-badge{
  font-family:'Space Mono',monospace;
  background:var(--bg-2);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:13px;color:var(--ink);white-space:nowrap;
}
.count-badge b{color:var(--saffron);}

/* ---- Tabs ---- */
.group-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.group-row label{font-size:13px;color:var(--muted);white-space:nowrap;}
.group-row select{
  flex:1;background:var(--bg-1);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;color:var(--ink);font-size:14px;font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;
}
.group-row select:focus{outline:none;border-color:var(--saffron);}
.tabs{display:flex;gap:6px;background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:22px;}
.tab{
  flex:1;text-align:center;padding:10px 8px;border-radius:10px;cursor:pointer;
  font-size:14px;font-weight:500;color:var(--muted);transition:.15s ease;user-select:none;
}
.tab.active{background:var(--saffron);color:#1a1608;font-weight:700;}
.tab:not(.active):hover{color:var(--ink);background:var(--bg-2);}

.view{display:none;}
.view.active{display:block;}

/* ---- Progress bar (card view) ---- */
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.progress-track{flex:1;height:6px;background:var(--bg-2);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--saffron));width:0%;transition:width .3s ease;}
.progress-label{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap;}

/* ---- Flashcard ---- */
.stage{display:flex;flex-direction:column;align-items:center;gap:18px;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:4px;}
.chip{
  font-size:12px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg-1);color:var(--muted);cursor:pointer;user-select:none;transition:.15s;
}
.chip.on{border-color:var(--saffron);color:var(--saffron);background:rgba(242,183,5,.08);}

.card-scene{width:100%;max-width:420px;perspective:1400px;}
.card{
  position:relative;width:100%;aspect-ratio:4/5;cursor:pointer;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;border:1px solid var(--line);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
}
.face.front{
  background:linear-gradient(160deg,var(--bg-1),var(--bg-2));
}
.face.back{
  background:linear-gradient(160deg,#1c2a24,#152420);
  transform:rotateY(180deg);
  border-color:rgba(95,203,147,.35);
}
.no-tag{
  position:absolute;top:16px;left:18px;font-family:'Space Mono',monospace;
  font-size:12px;color:var(--muted);
}
.star-btn{
  position:absolute;top:14px;right:14px;font-size:20px;background:none;border:none;
  cursor:pointer;line-height:1;padding:6px;color:var(--muted);z-index:5;
}
.star-btn.on{color:var(--saffron);}
.speak-btn{
  position:absolute;top:52px;right:14px;font-size:18px;background:none;border:1px solid var(--line);
  border-radius:999px;cursor:pointer;line-height:1;padding:8px;color:var(--muted);z-index:5;
  transition:.15s;
}
.speak-btn:hover{border-color:var(--saffron);color:var(--saffron);}
.speak-btn.playing{color:var(--mint);border-color:var(--mint);}
.row .speak{background:none;border:none;cursor:pointer;color:var(--muted);font-size:15px;padding:4px;}
.row .speak:hover{color:var(--mint);}
.q-word-row{display:flex;align-items:center;justify-content:center;gap:10px;}
.q-speak{background:none;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--muted);font-size:16px;padding:8px 10px;}
.q-speak:hover{border-color:var(--mint);color:var(--mint);}
.kr-word{
  font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(34px,9vw,52px);
  text-align:center;line-height:1.25;
}
.jp-word{
  font-family:'Noto Sans JP','Noto Sans KR',sans-serif;font-weight:700;font-size:clamp(24px,6vw,34px);
  text-align:center;color:var(--mint);line-height:1.3;
}
.hint{position:absolute;bottom:16px;font-size:11px;color:var(--muted);letter-spacing:.04em;}

.controls{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center;}
button.ctl{
  font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:500;
  background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
  padding:11px 16px;border-radius:12px;cursor:pointer;transition:.15s;
  display:flex;align-items:center;gap:6px;
}
button.ctl:hover{border-color:var(--saffron);}
button.ctl.primary{background:var(--saffron);color:#1a1608;border-color:var(--saffron);font-weight:700;}
button.ctl.primary:hover{filter:brightness(1.08);}
button.ctl.know{border-color:var(--mint);color:var(--mint);}
button.ctl.know.active{background:var(--mint);color:#0d1f17;}
button.ctl:disabled{opacity:.35;cursor:not-allowed;}

/* ---- List view ---- */
.search-row{display:flex;gap:10px;margin-bottom:14px;}
.search-row input{
  flex:1;background:var(--bg-1);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--ink);font-size:15px;font-family:inherit;
}
.search-row input:focus{outline:none;border-color:var(--saffron);}
.jamo-strip{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
.jamo-btn{
  font-family:'Gowun Batang',serif;font-size:13px;padding:5px 9px;border-radius:8px;
  background:var(--bg-1);border:1px solid var(--line);color:var(--muted);cursor:pointer;
}
.jamo-btn.on{color:var(--saffron);border-color:var(--saffron);}
.list-count{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:10px;}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.row{
  display:grid;grid-template-columns:40px 1fr 1fr 30px 30px;align-items:center;gap:8px;
  padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg-1);
}
.row:last-child{border-bottom:none;}
.row:nth-child(even){background:var(--bg-2);}
.row .no{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);}
.row .kr{font-family:'Gowun Batang',serif;font-size:17px;font-weight:700;}
.row .jp{font-size:14px;color:var(--mint);}
.row .star{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;}
.row .star.on{color:var(--saffron);}
.empty-note{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px;}

/* ---- Quiz view ---- */
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.quiz-score{font-family:'Space Mono',monospace;font-size:13px;color:var(--muted);}
.quiz-score b{color:var(--mint);}
.quiz-card{
  border:1px solid var(--line);border-radius:20px;padding:32px 22px;text-align:center;
  background:linear-gradient(160deg,var(--bg-1),var(--bg-2));margin-bottom:16px;
}
.quiz-card .q-no{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:10px;}
.quiz-card .q-word{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(32px,8vw,44px);}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.choice{
  padding:16px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg-1);
  cursor:pointer;font-size:15px;text-align:center;transition:.12s;
}
.choice:hover{border-color:var(--saffron);}
.choice.correct{background:rgba(95,203,147,.18);border-color:var(--mint);color:var(--mint);}
.choice.wrong{background:rgba(232,96,76,.18);border-color:var(--coral);color:var(--coral);}
.choice.disabled{pointer-events:none;}
.quiz-next{display:flex;justify-content:center;margin-top:16px;}
.quiz-done{text-align:center;padding:40px 10px;}
.quiz-done .big{font-family:'Gowun Batang',serif;font-size:40px;font-weight:700;color:var(--saffron);}

footer.foot{margin-top:60px;text-align:center;color:var(--muted);font-size:11px;line-height:1.8;}
footer.foot a{color:var(--muted);}

@media (max-width:480px){
  .choices{grid-template-columns:1fr;}
  .row{grid-template-columns:30px 1fr 1fr 26px 26px;padding:10px;}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="eyebrow">韓国語能力試験 · TOPIK I</span>
      <h1>初級単語帳</h1>
      <div class="sub">1〜2級 必須語彙 1,671語 · 日本語訳付き</div>
    </div>
    <div class="count-badge">暗記完了 <b id="knownCount">0</b> / 1671</div>
  </header>

  <div class="group-row">
    <label for="groupSelect">グループ</label>
    <select id="groupSelect"></select>
  </div>

  <nav class="tabs">
    <div class="tab active" data-view="card">🗂 カード</div>
    <div class="tab" data-view="list">🔎 一覧</div>
    <div class="tab" data-view="quiz">✏️ クイズ</div>
  </nav>

  <!-- CARD VIEW -->
  <section class="view active" id="view-card">
    <div class="filter-row">
      <div class="chip on" data-filter="all">すべて</div>
      <div class="chip" data-filter="unknown">未暗記</div>
      <div class="chip" data-filter="known">暗記完了</div>
      <div class="chip" data-filter="star">⭐ お気に入り</div>
      <div class="chip on" id="autoplayChip">🔊 自動再生</div>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="cardProgressFill"></div></div>
      <div class="progress-label" id="cardProgressLabel">1 / 1671</div>
    </div>
    <div class="stage">
      <div class="card-scene">
        <div class="card" id="card">
          <div class="face front">
            <span class="no-tag" id="frontNo">No. 1</span>
            <button class="star-btn" id="starBtn">☆</button>
            <button class="speak-btn" id="speakBtn" title="発音を再生">🔊</button>
            <div class="kr-word" id="krWord">가게</div>
            <span class="hint">タップすると意味が見えます</span>
          </div>
          <div class="face back">
            <span class="no-tag" id="backNo">No. 1</span>
            <div class="jp-word" id="jpWord">店</div>
            <span class="hint">もう一度タップすると表に戻ります</span>
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="ctl" id="prevBtn">◀ 前へ</button>
        <button class="ctl primary" id="shuffleBtn">🔀 ランダム</button>
        <button class="ctl" id="nextBtn">次へ ▶</button>
      </div>
      <div class="controls">
        <button class="ctl know" id="knowBtn">✅ 暗記完了にする</button>
      </div>
    </div>
  </section>

  <!-- LIST VIEW -->
  <section class="view" id="view-list">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="ハングルまたは日本語で検索...（例：가게、店）">
    </div>
    <div class="jamo-strip" id="jamoStrip"></div>
    <div class="list-count" id="listCount">1671語</div>
    <div class="list" id="listBody"></div>
  </section>

  <!-- QUIZ VIEW -->
  <section class="view" id="view-quiz">
    <div class="quiz-head">
      <div class="quiz-score">スコア <b id="quizScore">0</b> / <span id="quizTotal">0</span></div>
      <button class="ctl" id="quizRestart">↻ もう一度</button>
    </div>
    <div id="quizArea"></div>
  </section>

  <footer class="foot">
    TOPIK I 1671語彙 出典: trilingual.jp（Tomi先生）· 学習用個人制作ページ<br>
    Made with 🐦‍⬛ for 韓国語学習
  </footer>
</div>

/* ---------- shared state ---------- */
let known = {};     // no -> true
let starred = {};   // no -> true
let cardFilter = 'all';
let cardOrder = VOCAB.map(v => v.no);
let cardPos = 0;

function loadState(){
  try{
    known = JSON.parse(localStorage.getItem('topik1671_known') || '{}');
    starred = JSON.parse(localStorage.getItem('topik1671_starred') || '{}');
  }catch(e){ known = {}; starred = {}; }
}
function saveState(){
  try{
    localStorage.setItem('topik1671_known', JSON.stringify(known));
    localStorage.setItem('topik1671_starred', JSON.stringify(starred));
  }catch(e){ /* storage unavailable — progress stays in-memory only */ }
}
loadState();

function vocabByNo(no){ return VOCAB[no-1]; }

/* ---------- Grouping (40 words per set) ---------- */
const GROUP_SIZE = 40;
const GROUP_COUNT = Math.ceil(VOCAB.length / GROUP_SIZE);
let currentGroup = 0; // 0 = all words

function groupRange(g){
  const start = (g - 1) * GROUP_SIZE + 1;
  const end = Math.min(g * GROUP_SIZE, VOCAB.length);
  return [start, end];
}
function vocabInGroup(g){
  if(g === 0) return VOCAB.slice();
  const [s, e] = groupRange(g);
  return VOCAB.filter(v => v.no >= s && v.no <= e);
}

const groupSelect = document.getElementById('groupSelect');
(function populateGroupSelect(){
  const allOpt = document.createElement('option');
  allOpt.value = 0;
  allOpt.textContent = `すべて (1〜${VOCAB.length})`;
  groupSelect.appendChild(allOpt);
  for(let g = 1; g <= GROUP_COUNT; g++){
    const [s, e] = groupRange(g);
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = `${g}日目 (${s}〜${e})`;
    groupSelect.appendChild(opt);
  }
})();
groupSelect.addEventListener('change', ()=>{
  currentGroup = parseInt(groupSelect.value, 10);
  applyCardFilter();
  renderList();
  if(quizStarted) startQuiz();
});

/* ---------- Text-to-speech (Korean pronunciation) ---------- */
let autoplayOn = true;
let koVoice = null;
function pickKoreanVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  koVoice = voices.find(v => v.lang === 'ko-KR') || voices.find(v => v.lang && v.lang.startsWith('ko')) || null;
}
if('speechSynthesis' in window){
  pickKoreanVoice();
  window.speechSynthesis.onvoiceschanged = pickKoreanVoice;
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR';
  if(koVoice) utter.voice = koVoice;
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

function updateKnownCount(){
  document.getElementById('knownCount').textContent = Object.keys(known).filter(k=>known[k]).length;
}
updateKnownCount();

/* ---------- CARD VIEW ---------- */
const cardEl = document.getElementById('card');
const krWordEl = document.getElementById('krWord');
const jpWordEl = document.getElementById('jpWord');
const frontNoEl = document.getElementById('frontNo');
const backNoEl = document.getElementById('backNo');
const starBtn = document.getElementById('starBtn');
const speakBtn = document.getElementById('speakBtn');
const knowBtn = document.getElementById('knowBtn');
const progressFill = document.getElementById('cardProgressFill');
const progressLabel = document.getElementById('cardProgressLabel');

function applyCardFilter(){
  const base = vocabInGroup(currentGroup);
  let list;
  if(cardFilter === 'unknown') list = base.filter(v=>!known[v.no]);
  else if(cardFilter === 'known') list = base.filter(v=>known[v.no]);
  else if(cardFilter === 'star') list = base.filter(v=>starred[v.no]);
  else list = base.slice();
  cardOrder = list.map(v=>v.no);
  cardPos = 0;
  if(cardOrder.length === 0){ cardOrder = [(base[0] || VOCAB[0]).no]; }
  renderCard();
}

document.querySelectorAll('.chip[data-filter]').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.chip[data-filter]').forEach(c=>c.classList.remove('on'));
    chip.classList.add('on');
    cardFilter = chip.dataset.filter;
    applyCardFilter();
  });
});

const autoplayChip = document.getElementById('autoplayChip');
autoplayChip.addEventListener('click', ()=>{
  autoplayOn = !autoplayOn;
  autoplayChip.classList.toggle('on', autoplayOn);
});

function renderCard(){
  cardEl.classList.remove('flipped');
  const no = cardOrder[cardPos];
  const v = vocabByNo(no);
  krWordEl.textContent = v.kr;
  jpWordEl.textContent = v.jp;
  frontNoEl.textContent = 'No. ' + v.no;
  backNoEl.textContent = 'No. ' + v.no;
  starBtn.textContent = starred[v.no] ? '★' : '☆';
  starBtn.classList.toggle('on', !!starred[v.no]);
  knowBtn.classList.toggle('active', !!known[v.no]);
  knowBtn.textContent = known[v.no] ? '✅ 暗記完了' : '✅ 暗記完了にする';
  progressFill.style.width = (((cardPos+1)/cardOrder.length)*100) + '%';
  progressLabel.textContent = (cardPos+1) + ' / ' + cardOrder.length;
  if(autoplayOn) speak(v.kr);
}

cardEl.addEventListener('click', ()=> cardEl.classList.toggle('flipped'));
speakBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  const no = cardOrder[cardPos];
  speak(vocabByNo(no).kr);
});

document.getElementById('nextBtn').addEventListener('click', ()=>{
  cardPos = (cardPos+1) % cardOrder.length;
  renderCard();
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  cardPos = (cardPos-1+cardOrder.length) % cardOrder.length;
  renderCard();
});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  for(let i=cardOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [cardOrder[i],cardOrder[j]] = [cardOrder[j],cardOrder[i]];
  }
  cardPos = 0;
  renderCard();
});
starBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  const no = cardOrder[cardPos];
  starred[no] = !starred[no];
  saveState();
  renderCard();
});
knowBtn.addEventListener('click', ()=>{
  const no = cardOrder[cardPos];
  known[no] = !known[no];
  saveState();
  updateKnownCount();
  renderCard();
});

applyCardFilter();

    activeJamo = (activeJamo === j) ? null : j;
    document.querySelectorAll('.jamo-btn').forEach(x=>x.classList.remove('on'));
    if(activeJamo) b.classList.add('on');
    renderList();
  });
  jamoStrip.appendChild(b);
});

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', renderList);

function initialConsonantMatch(word, jamoChar){
  // rough 가나다 grouping: match on first syllable's leading consonant block by unicode range
  const groups = {
    '가':[0,1,2,3], '나':[4,5], '다':[6,7,8], '라':[9],
    '마':[10], '바':[11,12], '사':[13,14], '아':[15],
    '자':[16,17], '차':[18], '카':[19], '타':[20], '파':[21], '하':[22]
  };
  const code = word.charCodeAt(0) - 0xAC00;
  if(code < 0 || code > 11171) return false;
  const lead = Math.floor(code / 588);
  return groups[jamoChar] && groups[jamoChar].includes(lead);
}

function renderList(){
  const q = searchInput.value.trim().toLowerCase();
  let list = vocabInGroup(currentGroup).filter(v=>{
    let ok = true;
    if(q) ok = v.kr.toLowerCase().includes(q) || v.jp.toLowerCase().includes(q);
    if(ok && activeJamo) ok = initialConsonantMatch(v.kr, activeJamo);
    return ok;
  });
  document.getElementById('listCount').textContent = list.length + '語';
  const body = document.getElementById('listBody');
  body.innerHTML = '';
  if(list.length === 0){
    body.innerHTML = '<div class="empty-note">検索結果がありません</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  list.slice(0, 400).forEach(v=>{
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="no">${v.no}</span>
      <span class="kr">${v.kr}</span>
      <span class="jp">${v.jp}</span>
      <button class="speak" title="発音を再生">🔊</button>
      <button class="star ${starred[v.no]?'on':''}">${starred[v.no]?'★':'☆'}</button>
    `;
    row.querySelector('.star').addEventListener('click', ()=>{
      starred[v.no] = !starred[v.no];
      saveState();
      renderList();
    });
    row.querySelector('.speak').addEventListener('click', ()=> speak(v.kr));
    frag.appendChild(row);
  });
  body.appendChild(frag);
  if(list.length > 400){
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = `上位400件のみ表示中（検索で絞り込めます）· 全${list.length}語`;
    body.appendChild(note);
  }
}

/* ---------- QUIZ VIEW ---------- */
let quizStarted = false;
let quizPool = [];
let quizIdx = 0;
let quizScore = 0;
let quizAnswered = false;

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function startQuiz(){
  quizStarted = true;
  const pool = vocabInGroup(currentGroup);
  quizPool = shuffleArr(pool.slice()).slice(0, Math.min(20, pool.length));
  quizIdx = 0;
  quizScore = 0;
  quizAnswered = false;
  document.getElementById('quizTotal').textContent = quizPool.length;
  renderQuiz();
}
document.getElementById('quizRestart').addEventListener('click', startQuiz);

function renderQuiz(){
  document.getElementById('quizScore').textContent = quizScore;
  const area = document.getElementById('quizArea');
  if(quizIdx >= quizPool.length){
    area.innerHTML = `<div class="quiz-done">
      <div class="big">${quizScore} / ${quizPool.length}</div>
      <p style="color:var(--muted);margin-top:10px;">お疲れさまでした！「もう一度」を押すと新しい問題に挑戦できます。</p>
    </div>`;
    return;
  }
  const q = quizPool[quizIdx];
  let choices = [q];
  const others = shuffleArr(VOCAB.filter(v=>v.no!==q.no)).slice(0,3);
  choices = shuffleArr([q, ...others]);
  area.innerHTML = `
    <div class="quiz-card">
      <div class="q-no">Q${quizIdx+1}. No.${q.no} · 意味を選んでください</div>
      <div class="q-word-row">
        <div class="q-word">${q.kr}</div>
        <button class="q-speak" id="qSpeakBtn" title="発音を再生">🔊</button>
      </div>
    </div>
    <div class="choices" id="choicesWrap"></div>
    <div class="quiz-next"><button class="ctl primary" id="nextQBtn" style="display:none;">次の問題 ▶</button></div>
  `;
  document.getElementById('qSpeakBtn').addEventListener('click', ()=> speak(q.kr));
  if(autoplayOn) speak(q.kr);
  const wrap = document.getElementById('choicesWrap');
  quizAnswered = false;
  choices.forEach(c=>{
    const btn = document.createElement('div');
    btn.className = 'choice';
    btn.textContent = c.jp;
    btn.addEventListener('click', ()=>{
      if(quizAnswered) return;
      quizAnswered = true;
      const isCorrect = c.no === q.no;
      if(isCorrect){ btn.classList.add('correct'); quizScore++; }
      else{
        btn.classList.add('wrong');
        wrap.querySelectorAll('.choice').forEach(b=>{
          if(b.textContent === q.jp) b.classList.add('correct');
        });
      }
      wrap.querySelectorAll('.choice').forEach(b=>b.classList.add('disabled'));
      document.getElementById('quizScore').textContent = quizScore;
      document.getElementById('nextQBtn').style.display = 'inline-flex';
    });
    wrap.appendChild(btn);
  });
  document.getElementById('nextQBtn').addEventListener('click', ()=>{
    quizIdx++;
    renderQuiz();
  });
}
</script>
